version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_automated_monitoring
    ports:
      - "9090:9090"
    volumes:
      # Esto es vital: conecta el YAML que genera tu Java con el cerebro de Prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-lifecycle' # Permite recargar la config en caliente sin apagar el contenedor

  grafana:
    image: grafana/grafana:latest
    container_name: grafana_automated_monitoring
    ports:
      - "3004:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    depends_on:
      - prometheus