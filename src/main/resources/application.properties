spring.application.name=Automated Monitoring & Analytics System

# ==========================================
# CONFIGURACION DE BASE DE DATOS (POSTGRESQL)
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/monitoreo_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# CONFIGURACION DE JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# CONFIGURACION DEL ORQUESTADOR
# ==========================================
prometheus.config.path=./prometheus.yml
prometheus.api.url=http://localhost:9090
jwt.secret.key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

# ==========================================
# ACTUATOR & PROMETHEUS
# ==========================================
management.endpoints.web.exposure.include=prometheus,health,info
management.metrics.export.prometheus.enabled=true
management.endpoint.prometheus.enabled=true
