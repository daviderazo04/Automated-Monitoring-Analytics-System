spring.application.name=Automated Monitoring & Analytics System

# ==========================================
# CONFIGURACION DE BASE DE DATOS (POSTGRESQL)
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/monitoreo_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# CONFIGURACION DE JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ==========================================
# CONFIGURACION DEL ORQUESTADOR
# ==========================================
prometheus.config.path=./prometheus.yml
prometheus.api.url=http://localhost:9090
prometheus.global.scrape-interval=15s

# Host + puerto donde Prometheus (en docker) alcanza al manager que corre en el host.
# En cloud (mismo VPC/cluster) sobreescribe con: manager.host=manager, manager.port=8080
manager.host=host.docker.internal
manager.port=8080

jwt.secret.key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

# ==========================================
# ACTUATOR & PROMETHEUS
# ==========================================
management.endpoints.web.exposure.include=prometheus,health,info,metrics
management.endpoint.prometheus.enabled=true
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}

# Histogramas para percentiles de latencia HTTP (p50/p95/p99) y GC
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
management.metrics.distribution.sla.http.server.requests=50ms,100ms,200ms,400ms,1s

# Habilita las métricas de la JVM, logback, GC y procesador (ya vienen con actuator, pero explícito es mejor)
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true
management.metrics.enable.hikaricp=true
